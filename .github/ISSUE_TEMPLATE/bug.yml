name: Bug report
description: Something in Touchy isn't working
labels: [bug]
body:
  - type: dropdown
    id: switch
    attributes:
      label: Which switch?
      options: [Touch, Apple logo glow, Both, Something else]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Include any error message.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Touchy version
      placeholder: "0.4.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: "macOS 27.2, MacBook Pro PROLED XDR 14-inch"
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: System language
      placeholder: English
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: For touch-switch problems, drag in ~/Library/Logs/Touchy-axtree.txt.
